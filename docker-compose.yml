services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Configura POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Configura POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 30
  backend:
    build: ./backend
    restart: unless-stopped
    ports: ['127.0.0.1:${BACKEND_PORT:-3000}:3000']
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET}
      AUTH_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
      NOTIFICATION_INTERNAL_SECRET: ${NOTIFICATION_INTERNAL_SECRET:?Configura NOTIFICATION_INTERNAL_SECRET}
      PORT: 3000
  notification-service:
    build: ./notification-service
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      NODE_API_URL: http://backend:3000
      NOTIFICATION_INTERNAL_SECRET: ${NOTIFICATION_INTERNAL_SECRET:?Configura NOTIFICATION_INTERNAL_SECRET}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: synkro@example.invalid
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:${BACKEND_PORT:-3000}/api
    restart: unless-stopped
    ports: ['127.0.0.1:${FRONTEND_PORT:-5173}:5173']
    depends_on:
      backend:
        condition: service_healthy
  mailpit:
    image: axllent/mailpit:v1.27.10
    restart: unless-stopped
    ports: ['127.0.0.1:${MAILPIT_PORT:-8025}:8025']
volumes:
  postgres_data:
