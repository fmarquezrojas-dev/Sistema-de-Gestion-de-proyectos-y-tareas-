name: SYNKRO checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: synkro_test
          POSTGRES_PASSWORD: synkro_test
          POSTGRES_DB: synkro_test
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U synkro_test -d synkro_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27.10
        ports: ['58025:8025', '51025:1025']
    env:
      TEST_DATABASE_URL: postgresql://synkro_test:synkro_test@127.0.0.1:55432/synkro_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: notification-service/requirements.txt
      - run: npm ci --prefix backend && npm ci --prefix frontend
      - run: npm run prisma:generate --prefix backend
      - run: npm run build --prefix backend && npm test --prefix backend
      - run: npm run lint --prefix frontend && npm run build --prefix frontend && npm test --prefix frontend
      - run: pip install -r notification-service/requirements.txt
      - run: python -m unittest discover -s notification-service -v
      - run: node backend/scripts/notification-integration.mjs
        env:
          SYNKRO_TEST_PYTHON: python
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e --prefix frontend
      - run: npm audit --prefix backend --omit=dev --audit-level=high && npm audit --prefix frontend --omit=dev --audit-level=high
      - run: git diff --exit-code -- backend/package-lock.json frontend/package-lock.json
